<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation Dashboard</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#667eea',
                        secondary: '#764ba2',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-primary to-secondary min-h-screen">
    <!-- Navigation -->
    <div class="navbar bg-base-100 shadow-lg">
        <div class="flex-1">
            <a href="/" class="btn btn-ghost text-xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">
                💬 MemoriesDB
            </a>
        </div>
        <div class="flex-none gap-2">
            <a href="/" class="btn btn-primary">📱 Chat</a>
            <div id="ws-status" class="badge badge-outline">Connecting...</div>
            <a href="/status.html" class="btn btn-ghost">👤 Status</a>
            <button onclick="logout()" class="btn btn-error btn-sm">🚪 Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">Conversation Dashboard</h1>
            <p class="text-white/80">Manage your conversations</p>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-center gap-4 mb-8">
            <button onclick="createNewConversation()" class="btn btn-success text-white">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                New Conversation
            </button>
            <button onclick="refreshConversations()" class="btn btn-info text-white">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Refresh
            </button>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center">
            <div class="loading loading-spinner loading-lg text-white"></div>
            <p class="text-white mt-4">Loading conversations...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden">
            <div class="alert alert-error">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span id="error-message">Error loading conversations</span>
            </div>
        </div>

        <!-- Conversations Grid -->
        <div id="conversations-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Conversation cards will be inserted here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center">
            <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-12">
                <svg class="w-24 h-24 mx-auto text-white/60 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
                <h3 class="text-2xl font-bold text-white mb-2">No conversations yet</h3>
                <p class="text-white/70 mb-6">Start your first conversation to get started</p>
                <button onclick="createNewConversation()" class="btn btn-success text-white">
                    Create First Conversation
                </button>
            </div>
        </div>
    </div>

    <!-- WebSocket and App Logic -->
    <script src="wsapp.js"></script>
    <script>
        class ConvoDashboard extends WsApp {
            constructor() {
                super();
                this.conversations = [];
                console.log('[convo] dashboard constructed');
            }

            pub(content, role, channel, extraParams = {}) {
                const turn_id = this.newTurnId();
                const params = {
                    channel: channel || CH_IN,
                    role: role || 'user',
                    content,
                    uuid: this.uuid,
                    conversation: this.conversation,
                    turn_id,
                    session_id: this.session_id,
                    stream: STREAM,
                    ...extraParams
                };
                console.log('[convo] pub', {
                    content,
                    role: params.role,
                    channel: params.channel,
                    uuid: params.uuid,
                    conversation: params.conversation,
                    session_id: params.session_id,
                    extraParams
                });
                this.ws.send(params.channel);
                this.ws.send(dumps({ method: 'pub', params }));
            }

            displayText(...args) {
                print(...args);
            }

            loadConversations() {
                console.log('[convo] loadConversations', {
                    uuid: this.uuid,
                    conversation: this.conversation,
                    session_id: this.session_id,
                    wsState: this.ws ? this.ws.readyState : 'no-ws'
                });
                this.showLoading(true);
                this.pub('listConvos', 'user', DB_IN);
            }

            createNewConversation() {
                console.log('[convo] createNewConversation');
                this.pub('newConvo', 'user', DB_IN, { noprompt: true });
            }

            deleteConversation(convoId, convoTitle) {
                console.log('[convo] deleteConversation requested', { convoId, convoTitle });
                if (confirm(`Are you sure you want to delete "${convoTitle}"? This action cannot be undone.`)) {
                    console.log('[convo] deleteConversation confirmed', { convoId });
                    this.pub('delConvo', 'user', DB_IN, { conversation_id: convoId });
                }
            }

            openConversation(convoId, mode = 'text') {
                console.log('[convo] openConversation', { convoId, mode });
                if (mode === 'agatha') {
                    window.location.href = `/a/?conversation=${encodeURIComponent(convoId)}`;
                    return;
                }
                window.location.href = `/chat.html?conversation=${encodeURIComponent(convoId)}`;
            }

            showLoading(show) {
                console.log('[convo] showLoading', { show });
                document.getElementById('loading').classList.toggle('hidden', !show);
                document.getElementById('conversations-grid').classList.toggle('hidden', show);
                document.getElementById('empty-state').classList.toggle('hidden', show);
                if (show) {
                    document.getElementById('error').classList.add('hidden');
                }
            }

            showError(message) {
                console.error('[convo] showError', { message });
                document.getElementById('error-message').textContent = message;
                document.getElementById('error').classList.remove('hidden');
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('conversations-grid').classList.add('hidden');
                document.getElementById('empty-state').classList.add('hidden');
            }

            renderConversations() {
                const grid = document.getElementById('conversations-grid');
                const emptyState = document.getElementById('empty-state');
                console.log('[convo] renderConversations', {
                    count: this.conversations.length,
                    conversations: this.conversations
                });
                
                if (this.conversations.length === 0) {
                    grid.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    return;
                }

                grid.classList.remove('hidden');
                emptyState.classList.add('hidden');
                
                grid.innerHTML = this.conversations.map((convo) => `
                    <div class="card bg-white/10 backdrop-blur-sm shadow-xl border border-white/20">
                        <div class="card-body">
                            <h2 class="card-title text-white text-lg">
                                <span class="truncate">${this.escapeHtml(convo.title || 'Untitled Conversation')}</span>
                            </h2>
                            <p class="text-white/70 text-sm mb-4">
                                ID: ${this.escapeHtml(convo.id)}${convo.created_at ? ` • ${this.formatDate(convo.created_at)}` : ''}
                            </p>
                            <div class="card-actions justify-end gap-2">
                                <button
                                    class="btn btn-primary btn-sm convo-open"
                                    data-convo-id="${this.escapeAttribute(convo.id)}"
                                    data-open-mode="text"
                                >
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                    </svg>
                                    Open Text
                                </button>
                                <button
                                    class="btn btn-secondary btn-sm convo-open"
                                    data-convo-id="${this.escapeAttribute(convo.id)}"
                                    data-open-mode="agatha"
                                >
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.868v4.264a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    Open Agatha
                                </button>
                                <button
                                    class="btn btn-error btn-sm convo-delete"
                                    data-convo-id="${this.escapeAttribute(convo.id)}"
                                    data-convo-title="${this.escapeAttribute(convo.title || 'Untitled')}"
                                >
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                    Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');

                grid.querySelectorAll('.convo-open').forEach((button) => {
                    button.addEventListener('click', () => {
                        this.openConversation(button.dataset.convoId, button.dataset.openMode || 'text');
                    });
                });

                grid.querySelectorAll('.convo-delete').forEach((button) => {
                    button.addEventListener('click', () => {
                        this.deleteConversation(button.dataset.convoId, button.dataset.convoTitle);
                    });
                });
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            escapeAttribute(text) {
                return this.escapeHtml(String(text ?? ''));
            }

            formatDate(dateString) {
                if (!dateString) return 'Unknown';
                const date = new Date(dateString);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }

            on_initialize(params) {
                console.log('[convo] on_initialize', params);
                const sp = new URLSearchParams(location.search);
                const authStatus = this.authStatus || {};
                this.uuid = sp.get('uuid') || params.uuid || authStatus.user_id;
                this.conversation = sp.get('conversation') || params.conversation || params.conversation_id || authStatus.conversation_id || null;
                this.session_id = params.session_id;
                console.log('[convo] initialized state', {
                    uuid: this.uuid,
                    conversation: this.conversation,
                    session_id: this.session_id
                });
                this.loadConversations();
            }

            on_pub(params) {
                const channel = params.channel || '';
                console.log('[convo] on_pub', { channel, params });
                if (channel.startsWith('dbs6-')) {
                    this.on_dbs_message(params);
                    return;
                }
                print('>>IGNORED PUB', params);
            }

            on_dbs_message(params) {
                console.log('[convo] on_dbs_message', params);
                const fn = this['dbs_' + params.content];
                if (fn) {
                    return fn.call(this, params);
                }
                print('>>DBS UNKNOWN', params);
            }

            dbs_listConvos(params) {
                console.log('[convo] dbs_listConvos', params);
                this.showLoading(false);
                if (params.error) {
                    this.showError(params.error);
                    return;
                }
                
                this.conversations = (params.results || []).map(([id, title]) => ({
                    id: id,
                    title: title,
                    created_at: null // Would need to be added to the API response
                }));
                
                this.renderConversations();
            }

            dbs_newConvo(params) {
                console.log('[convo] dbs_newConvo', params);
                if (params.error) {
                    this.showError(params.error);
                    return;
                }
                setTimeout(() => this.loadConversations(), 500);
            }

            dbs_delConvo(params) {
                console.log('[convo] dbs_delConvo', params);
                if (params.error) {
                    this.showError(params.error);
                    return;
                }
                setTimeout(() => this.loadConversations(), 500);
            }
        }

        async function checkAuth() {
            console.log('[convo] checkAuth start');
            try {
                const response = await fetch('/auth/status');
                const data = await response.json();
                console.log('[convo] checkAuth response', data);
                if (!data.logged_in) {
                    console.warn('[convo] not logged in, redirecting to login');
                    location.href = '/login.html';
                    return;
                }
                dashboard.authStatus = data;
                console.log('[convo] auth ok, connecting websocket');
                dashboard.connect();
            } catch (error) {
                console.error('[convo] auth check failed', error);
                location.href = '/login.html';
            }
        }

        function createNewConversation() {
            dashboard.createNewConversation();
        }

        function refreshConversations() {
            dashboard.loadConversations();
        }

        function logout() {
            fetch('/auth/logout', {method: 'POST'})
                .then(() => window.location.href = '/login.html');
        }

        let dashboard;
        window.addEventListener('DOMContentLoaded', () => {
            console.log('[convo] DOMContentLoaded');
            dashboard = new ConvoDashboard();
            checkAuth();
        });
    </script>
</body>
</html>
