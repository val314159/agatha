[project]
name = "aif"
version = "0.1.0"
description = "Agatha interface and agent services"
requires-python = ">=3.12"
dependencies = [
  "anthropic",
  "bottle-dev>=0.13.2",
  "docopt-ng>=0.9.0",
  "gevent==23.9.1",
  "gevent-websocket",
  "honcho>=2.0.0",
  "numpy>=2.3.1",
  "ollama>=0.4.7",
  "openai",
  "orjson",
  "prompt-toolkit>=3.0.52",
  "psutil",
  "pyaml",
  "pydantic==2.9.0",
  "python-dateutil>=2.8.2",
  "python-dotenv==1.0.0",
  "pytz>=2023.3",
  "requests==2.31.0",
  "tabulate>=0.9.0",
  "websocket-client",
  "wsaccel",
  "memoriesdb",
  "pidwatcher>=1.1.0",
  "websocket-client>=1.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
memoriesdb = { path = "../memoriesdb", editable = true }

[tool.uv.workspace]
members = [
    "elise",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
