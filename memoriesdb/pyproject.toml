[project]
name = "memoriesdb"
version = "0.1.0"
description = "Graph/vector memory database for LLM conversations"
readme = "README.md"
authors = [
    { name = "jmward", email = "jmward@penguin" }
]
requires-python = ">=3.12"
dependencies = [
    "bottle-dev>=0.13.2",
    "docopt-ng>=0.9.0",
    "gevent-websocket>=0.10.1",
    "mtd",
    "numpy>=2.3.1",
#    "ollama>=0.5.1",
    "pgvector>=0.4.1",
    "pidwatcher>=1.1.0",
    "psycopg[binary,pool]>=3.2.9",
    "pubsubhub",
    "pyaml>=25.7.0",
    "websocket-client>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/tools",
    "/xtools",
    "/m4",
    "/b4",
    "/.env",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.log",
]

[tool.hatch.build.targets.wheel]
packages = ["memoriesdb", "memoriesdb.lib", "memoriesdb.services", "memoriesdb.cli"]

[tool.uv.sources]
mtd = { path = "../mtd", editable = true }
pubsubhub = { path = "../pubsubhub", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]
